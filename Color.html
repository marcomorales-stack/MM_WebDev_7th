<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Color Theory Examples</title>
        <meta charset="UTF-8">
        <style>

            .comp{
                width: 300px;
                height: 300px;
                 background-color:rgb(219, 117, 33);
                border: solid 10px #104fc4;
                color: #104fc4;
                font-size: 2rem;
            }
              .analog{
                width: 300px;
                height: 300px;
                 background-color:rgb(192, 28, 207);
                border: solid 10px #e74514;
                color:rgb(128, 38, 68);
                font-size: 2rem;
            }
              .tri{
                width: 300px;
                height: 300px;
                 background-color:rgb(80, 7, 68);
                border: solid 10px #10c41f;
                color:rgb(194, 119, 48);
                font-size: 2rem;
            }
        </style>
    </head>
    <body>
        <h1>Color Theory Examples</h1>
        <div class="comp">
        <p>Complementary</p>
        </div>
        <div class="analog">
        <p>Analogous</p>
        </div>
        <div class="tri">
        <p>Triadic</p>
        </div>
    </body>
</html>
